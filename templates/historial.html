<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Ventas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>📜 Historial de Ventas</h1>

    <a href="/" class="volver-link">
        ← Volver al panel principal
    </a>

    <br><br>

    <div class="card">

        <table>

            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Ventas Totales</th>
                    <th>Comisión (25%)</th>
                </tr>
            </thead>

            <tbody>

                {% for dia in historial %}
                <tr>
                    <td>{{ dia[0] }}</td>
                    <td>${{ "%.2f"|format(dia[1]) }}</td>
                    <td>${{ "%.2f"|format(dia[1] * 0.25) }}</td>
                </tr>
                {% endfor %}

            </tbody>

        </table>

    </div>

    <br>


</div>

</body>
</html>
